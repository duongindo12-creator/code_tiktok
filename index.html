<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You - CreateJS Hearts</title>
    <!-- Nhúng thư viện CreateJS từ CDN -->
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #000; /* Nền đen */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
        }
    </style>
</head>
<body>

    <canvas id="demoCanvas" width="800" height="600"></canvas>

    <script>
        var canvas = document.getElementById("demoCanvas");
        var stage = new createjs.Stage(canvas);
        
        var w = canvas.width;
        var h = canvas.height;

        // --- Mảng chứa các hạt trái tim bay ---
        var hearts = [];
        var numHearts = 50; // Số lượng trái tim trên màn hình

        // Tạo các hình trái tim ngẫu nhiên
        for (var i = 0; i < numHearts; i++) {
            var heart = new createjs.Shape();
            
            // Vẽ hình trái tim bằng các đường path đồ họa vector
            heart.graphics.beginFill(getRandomColor())
                .moveTo(0, -5)
                .bezierCurveTo(-15, -25, -30, 0, 0, 25)
                .bezierCurveTo(30, 0, 15, -25, 0, -5);

            // Đặt vị trí ngẫu nhiên
            heart.x = Math.random() * w;
            heart.y = Math.random() * h;
            
            // Kích thước và tốc độ bay riêng cho từng trái tim
            heart.scaleX = heart.scaleY = Math.random() * 0.6 + 0.3;
            heart.vY = - (Math.random() * 1.5 + 0.5); // Tốc độ bay lên
            heart.vX = (Math.random() - 0.5) * 1;     // Lắc lư nhẹ theo chiều ngang
            
            hearts.push(heart);
            stage.addChild(heart);
        }

        // Hàm chọn màu hồng/tím ngẫu nhiên cho trái tim
        function getRandomColor() {
            var colors = ["#ff1493", "#ff69b4", "#da70d6", "#c71585", "#db7093", "#ffb6c1"];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // --- Đoạn code chữ của bạn ---
        var text = new createjs.Text("I LOVE YOU", "bold 50px 'Brush Script MT', cursive", "#ffffff");
        text.textAlign = "center";
        text.x = w / 2;
        text.y = h / 2 - text.getMeasuredLineHeight();
        stage.addChild(text);
        // -------------------------

        // --- Vòng lặp hoạt ảnh (Animation Loop) ---
        createjs.Ticker.framerate = 60;
        createjs.Ticker.on("tick", handleTick);

        function handleTick(event) {
            // Cho các trái tim bay lên liên tục
            for (var i = 0; i < hearts.length; i++) {
                var heart = hearts[i];
                heart.y += heart.vY;
                heart.x += heart.vX;

                // Nếu trái tim bay ra khỏi màn hình ở phía trên, đưa nó xuống dưới đáy để lặp lại
                if (heart.y < -30) {
                    heart.y = h + 30;
                    heart.x = Math.random() * w;
                }
            }

            // Vẽ lại stage liên tục để tạo chuyển động mượt mà
            stage.update(event);
        }
    </script>

</body>
</html>
